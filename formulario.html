<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Agregar / Editar Proceso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
 <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand" href="procesos.html">
      <img src="img/logo.png" alt="Logo" width="180" height="80">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
  </div>
</nav>
  <div class="container py-5">
    <h2 class="mb-4" id="tituloFormulario">Formulario para Agregar Nuevo Proceso</h2>
    <form id="formProceso" method="POST" enctype="multipart/form-data">
      <input type="hidden" id="id" name="id" />
      <div class="mb-3">
        <label for="titulo" class="form-label">Título del Proceso</label>
        <input type="text" class="form-control" id="titulo" name="titulo" required />
      </div>
      <div class="mb-3">
        <label for="descripcion" class="form-label">Descripción</label>
        <textarea class="form-control" id="descripcion" name="descripcion" rows="4" required></textarea>
      </div>
      <div class="mb-3">
        <label for="categoria" class="form-label">Categoría</label>
        <select class="form-select" id="categoria" name="categoria" required>
          <option value="">Selecciona una categoría</option>
          <option value="laptops">Laptops</option>
          <option value="cpu">CPU</option>
          <option value="camaras">Cámaras</option>
          <option value="impresoras">Impresoras</option>
          <option value="queseras">Queseras</option>
          <option value="switch">Switch</option>
          <option value="scannersMesa">Scanners de Mesa</option>
          <option value="scannersMano">Scanners de Mano</option>
          <option value="hornos">Hornos</option>
          <option value="teclados">Teclados</option>
          <option value="monitores">Monitores</option>
          <option value="cajonesDinero">Cajones de Dinero</option>
          <option value="roladoras">Roladoras</option>
          <option value="allinone">ALL IN ONE</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="media_url" class="form-label">Subir Imagen</label>
        <input type="file" class="form-control" id="media_url" name="media_url" accept="image/*" />
      </div>
      <button type="submit" class="btn btn-success" id="btnGuardar">Guardar Proceso</button>
      <a href="procesos.html" class="btn btn-secondary ms-2">Cancelar</a>
    </form>
  </div>
  <script src="js/procesos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
