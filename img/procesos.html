<!-- FILTROS -->
<main class="container my-5">
  <section class="bg-white rounded shadow-sm p-4 mb-4">
    <form class="row g-3 align-items-center" aria-label="Formulario de filtrado de procesos">
      <div class="col-md-6">
        <label for="categoria" class="form-label">Categoría:</label>
        <select id="categoria" class="form-select">
          <option value="">Seleccionar equipo</option>
          <option value="laptops">Laptops</option>
          <option value="cpu">CPU</option>
          <option value="camaras">Cámaras</option>
          <option value="hornos">Hornos</option>
          <option value="teclado">Teclados</option>
          <option value="impresoras">Impresoras</option>
          <option value="monitores">Monitores</option>
          <option value="switch">Switch</option>
          <option value="quesera">Queseras</option>
          <option value="scanners">Scanners</option>
        </select>
      </div>
      <div class="col-md-6">
        <label for="busqueda" class="form-label">Buscar proceso:</label>
        <input type="text" id="busqueda" class="form-control" placeholder="Buscar por título">
      </div>
    </form>
  </section>

  <!-- RESULTADO DEL PROCESO -->
  <section class="bg-white rounded shadow-sm p-4">
    <h2 id="tituloProceso" class="text-primary mb-3">Selecciona una categoría</h2>
    <div id="mediaProceso" class="mb-3"></div>
    <p id="descripcionProceso" class="text-muted"></p>

    <!-- BOTONES -->
    <div class="d-flex justify-content-between mt-4">
      <button id="btnAtras" class="btn btn-outline-primary px-4" disabled><i class="fa fa-arrow-left me-2"></i> Atrás</button>
      <button id="btnSiguiente" class="btn btn-primary px-4" disabled>Siguiente <i class="fa fa-arrow-right ms-2"></i></button>
    </div>
  </section>
</main>

    <div class="row">
      <!-- LOGO -->
      <div class="col-md-4 mb-4">
